
openapi: 3.0.0
info:
  description: Proposal for Sber/VM API (To be Discussed)
  version: 0.0.1
  title: Sber/VM API Draft
  contact:
    email: aa.vasilyev@etpgpb.ru
servers:
  - url: "https://api-test.market-navi.ru/v1"
security:
  - bearerAuth: []

paths:
  /search:
    post:
      security:
        - bearerAuth: [] 

      summary: Processing external search request
      description: >+
        Синхронно выполняется только приём поискового запроса от внешней системы.
        Ответ 202 означает, что запрос принят; сам поиск выполняется асинхронно.
        Текущее состояние и результаты доступны через GET /search/{search_id}.
      operationId: createSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequestBody"
        description: Search session parameters
        required: true
      responses:
        "202":
          description: Accepted - Запрос на поиск принят поисковой машиной
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Bad Request - Запрос на поиск имеет некорректный формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized - Запрос не авторизован на стороне VM
          headers:
            WWW-Authenticate:
              description: Bearer challenge для авторизации запроса.
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
       
        "403":
          description: Forbidden - Выполнение запроса запрещено на стороне VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests - Превышен [rate limit] (для данного пользователя)
            или [service limit] (для данной организации)
          headers:
            Retry-After:
              description: Период ожидания (в секундах) после которого можно повторить запрос.
              schema:
                minimum: 1
                type: integer
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Service Error - ALERT: Ошибка сервера
            (неидентифицированная)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Not Implemented - Запрос данного типа или в данной конфигурации не
            поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Service unavailable - ALERT: Сервис поиска временно недоступен"
          headers:
            Retry-After:
              description: Период ожидания (в секундах) после которого можно повторить запрос.
              schema:
                minimum: 1
                type: integer
                example: 120
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /search/{search_id}:
    get:
      security:
        - bearerAuth: [] 

      summary: Get search status and result
      description: >+
        (**SYNC - синхронный**)
        Возвращает текущее состояние (`search_status`) и результаты поиска, если они доступны.
        Каждый ответ содержит полный список результатов, доступных на момент формирования ответа,
        если результаты доступны. Это полный снимок, а не изменения относительно предыдущего ответа:
        клиент заменяет ранее полученный список текущим.
        При `search_status = RUNNING` список включает все результаты, найденные к этому моменту.
        По завершении обработки (`search_status = DONE`) доступны итоговые результаты поиска.
      operationId: getSearchState
      parameters:
        - name: search_id
          in: path
          description: >+
            Уникальный код поисковой сессии на стороне VM. 
            (из ответа 202 при запуске поиска)
          required: true
          schema:
            type: string
            format: uuid
      responses:

        "200":
          description: SearchState - Поиск найден и принадлежит этой внешней
            системе/пользователю
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
            
        "401":
          description: Not Authorized - Токен недействителен
          headers:
            WWW-Authenticate:
              description: Bearer challenge для авторизации запроса.
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
           
        "404":
          description: SEARCH NOT FOUND - Поиск не найден либо создан для другой внешней
            системы/пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "410":
          description: Gone - Срок доступности поисковой сессии или её результатов истёк (expires_at).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "429":
          description: >+
           Too Many Requests - превышен лимит на количество запросов
          headers:
            Retry-After:
              description: Период ожидания (в секундах) после которого можно повторить запрос.
              schema:
                minimum: 1
                type: integer
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  
    delete:
      security:
        - bearerAuth: [] 

      summary: Cancel running search
      description: >+
        (**SYNC - синхронный**)
        Остановка поискового запроса на стороне VM.
        Объект `Response` содержит значение `search_status = CANCELLED`.
        Может содержать полный список результатов выполнения поискового запроса,
        доступных на момент прекращения обработки.
      operationId: cancelSearch
      parameters:
        - name: search_id
          in: path
          description: >+
            Уникальный код поисковой сессии на стороне VM. 
            (из ответа 202 при запуске поиска)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "SEARCH CANCELLED - Поиск остановлен. Статус CANCELLED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

        "401":
          description: "Not Authorized - Токен недействителен"
          headers:
            WWW-Authenticate:
              description: Bearer challenge для авторизации запроса.
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: "SEARCH NOT FOUND - Поиск не найден"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: >+
            SEARCH NOT CANCELLABLE - Остановить нечего: поиск уже завершён (DONE), 
            либо уже остановлен (CANCELLED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /order:
    post:
      security:
        - bearerAuth: [] 

      description: >+
        (**SYNC - синхронный**)
        Пользователь отобрал из поиска товары для закупки и передает
        эти товары для формирования заказа / коммерческого предложения.
      summary: Create purchase order upon search result
      operationId: createPurchaseOrder
      requestBody:
        description: >+
          Тело запроса на создание заказа / коммерческого предложения.
          В данном вызове выполняется только создание такого заказа и возвращается его идентификатор.
          Обработка запроса выполняется асинхронно другим сервисом.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequestBody"
      responses:
        "202":
          description: Заказ создан успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
                
        "400":
          description: "Can't create purchase order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: "Not Authorized - Токен недействителен"
          headers:
            WWW-Authenticate:
              description: Bearer challenge для авторизации запроса.
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: "Search Request not found or search results expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "410":
          description: "Ordered products not found or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "429":
          description: >+
           Too Many Requests - превышен лимит на количество запросов
          headers:
            Retry-After:
              description: Период ожидания (в секундах) после которого можно повторить запрос.
              schema:
                minimum: 1
                type: integer
                example: 42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Service Error - ALERT: Ошибка сервера
            (неидентифицированная)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Not Implemented - Запрос данного типа или в данной конфигурации не
            поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >+
           Service Unavailable
          headers:
            Retry-After:
              description: Период ожидания (в секундах) после которого можно повторить запрос.
              schema:
                minimum: 1
                type: integer
                example: 120
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # External request's context provided by client
    RequestContext:
      type: object
      description: >+
        Контекст запроса, полученный от внешнего клиента.
        Никогда не изменяется в ходе обработки запроса.
      required:
        - request_id
        - request_timestamp
      properties:
        request_id:
          nullable: false
          type: "string"
          format: "uuid"
          description: "Уникальный код запроса на поиск со стороны отправителя"
        request_timestamp:
          nullable: false
          type: "string"
          format: date-time
          description: "ISO 8601 (UTC/Z) - Метка времени создания запроса на стороне отправителя"
          
    # General search request parameters
    SearchRequestBody:
      type: "object"
      description: Объект [параметры поискового запроса] от внешней системы
      required:
        - request_context
        - query_params
      properties:
        request_context:
          $ref: "#/components/schemas/RequestContext"
        query_params:
          $ref: "#/components/schemas/QueryParams"

    # SEARCH RESPONSE object
    SearchResponse:
      type: object
      description: >+
        Объект успешного ответа сервера VM для эндпоинтов SEARCH.
        Для HTTP-ошибок используется отдельная схема ErrorResponse.
      required:
        - request_context
        - description
        - timestamp
        - expires_at
      properties:
        request_context:
          $ref: "#/components/schemas/RequestContext"
        description:
          type: string
          description: Расширенное описание статуса ответа VM
        timestamp:
          type: string
          format: date-time
          description: Метка времени ISO-8601 (UTC/Z) создания ответа на стороне VM
        expires_at:
          type: string
          format: date-time
          description: >+
            Метка времени ISO-8601 (UTC/Z), до которой доступны данные поисковой сессии.
            Равна timestamp текущего ответа плюс 24 часа.
            При каждом успешном ответе SEARCH срок доступности обновляется.
        search_id:
          type: string
          nullable: true
          format: uuid
          description: >+
            Уникальный код поисковой сессии на стороне VM.
            **request_id <-> search_id** образуют уникальную пару для точной идентификации и
            сопоставления результатов с конкретным поисковым запросом.
            **Может** иметь значение NULL, если `search_status = NONE`.
        search_status:
          type: string
          nullable: false
          description: >+
            Текущий статус выполнения поискового запроса на стороне VM:
            NONE - поисковый запрос не запущен
            RUNNING - поисковый запрос выполняется
            DONE - поисковый запрос завершен. Доступны результаты.
            CANCELLED - поисковый запрос остановлен по запросу внешней системы. Если результаты есть, то они доступны в ответе.
            ERROR - поисковый запрос прерван из-за ошибки на стороне выполнения. Результаты недоступны.
          default: NONE
          enum: [NONE, RUNNING, DONE, CANCELLED, ERROR]
        search_result:
          # Контейнер с доступными результатами выполнения поискового запроса.
          $ref: "#/components/schemas/SearchResult"
       
    ErrorResponse:
      type: object
      description: Единый формат ответа для всех HTTP-ошибок API.
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Машиночитаемый код ошибки.
        message:
          type: string
          description: Описание ошибки.
        request_context:
          type: object
          description: Контекст запроса, если идентификатор запроса удалось получить.
          properties:
            request_id:
              type: string
              description: Идентификатор запроса со стороны отправителя, если он доступен.
        params:
          type: string
          description: Дополнительные параметры ошибки, если они доступны.
        timestamp:
          type: string
          format: date-time
          description: Метка времени ISO-8601 (UTC/Z) создания ответа с ошибкой.
      example:
        error: string
        message: string
        request_context:
          request_id: string
        params: string
        timestamp: "2026-11-09T10:07:20.666Z"

    # CONTAINER: Result of search
    SearchResult:
      type: object
      description: >+
        Контейнер с атрибутами поиска и массивом результатов обработки поискового запроса.
        Каждый ответ содержит полный список результатов, доступных на момент формирования ответа.
        При `search_status = RUNNING` это все результаты, найденные к текущему моменту,
        а не только новые результаты с момента предыдущего ответа.
        При `search_status = DONE` содержит итоговый список, если результаты доступны.
      required:
        - query_params
        - items_count
        - items
      properties:  
        query_params:
          $ref: "#/components/schemas/QueryParams"
        items_count:
          type: integer
          description: Количество товаров; 0 = товары не найдены
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"
    
    QueryParams:
      type: object
      description: >+
        Параметры поиска, в т.ч. необязательные, которые должны учитываться при 
        выполнении запроса.
      required:
        - search_pattern
        - delivery_address
      properties:
        search_pattern:
          nullable: false
          minLength: 1
          type: "string"
          description: >+
            Тело (текст / образец) поискового запроса в свободной форме.
            Обязательный параметр.
            Если текст запроса на создание заказа не может быть опознан как содержательный текст,
            то такой запрос будет отклонен с ошибкой 400.
        delivery_address:
          nullable: false
          type: "string"
          description: >+
            Адрес доставки.
            Обязательный параметр.
            Если текст параметра не может быть валидирован как адрес,
            то запрос будет отклонен с ошибкой 400.
        query_filters:
          nullable: true
          type: object
          $ref: '#/components/schemas/QueryFilters'

    QueryFilters:
      type: object
      description: >+
        Дополнительные параметры, которые могут уточнить / расширить область поиска и
        отфильтровать наиболее релевантные результаты
      properties:
        product_aliases:
          description: >+
            Список слов - возможных (альтернативных) наименований товара (синонимов)
          type: array
          nullable: true
          items:
            type: string
        product_keywords:
          description: >+
            Список ключевых слов, указывающих на релевантность товара
          type: array
          nullable: true
          items:
            type: string
        user_rank:
          description: >+
            Рейтинг товара по мнению пользователей (покупателей).
          type: number
          nullable: true
          default: 0
          minimum: 0
        supplier_rank:
          description: >+
            Рейтинг поставщика.
          type: number
          nullable: true
          default: 0
          minimum: 0
        manufacturer_rank:
          description: >+
            Рейтинг изготовителя.
          type: number
          nullable: true
          default: 0
          minimum: 0
        brands:
          description: >+
            Список предпочительных брендов / торговых марок товара
          type: array
          nullable: true
          items:
            type: string
        manufacturers:
          description: >+
            Список названий компаний - производителей товара
          type: array
          nullable: true
          items:
            type: string
        oem_allowed:
          description: >+
            Допускается продукция OEM/NONAME производителей.
            При значении FALSE допускается только оригинальная продукция от производителей, указанных
            в списке `manufacturers`.
          type: boolean
          default: true
          nullable: true
        min_price:
          description: >+
            Минимально допустимая цена
          type: number
          nullable: true
          minimum: 0
        max_price:
          description: >+
            Максимально допустимая цена
          type: number
          nullable: true
          minimum: 0
        price_currency:
          $ref: "#/components/schemas/Currencies"
        delivery_cost:
          description: >+
            Максимально допустимая стоимость доставки
          type: number
          nullable: true
          minimum: 0
        delivery_currency:
          $ref: "#/components/schemas/Currencies"
        delivery_time:
          description: |
            Желаемый срок доставки для фильтрации результатов поиска:
            - today — сегодня;
            - tomorrow — завтра;
            - from_1_hour — от 1 часа;
            - up_to_3_days — до 3 дней;
            - up_to_5_days — до 5 дней;
            - up_to_12_days — до 12 дней.
            При отсутствии параметра или null ограничение срока доставки не задаётся.
          type: string
          nullable: true
          enum: [today, tomorrow, from_1_hour, up_to_3_days, up_to_5_days, up_to_12_days, null]

    ProductCard:
      type: object
      description: >+
        Карточка товара в результатах поиска. 
        Представлена в структуре эталонной карточки.
      required:
        - product_id
        - rank
        - product_description
        - characteristics
        - offers
      properties:
        product_id:
          type: string
          format: uuid
          description: >+
            Идентификатор карточки товара в поиске.
            **Важно!** Данный id определяет карточку, а не конкретный товар! Один и тот же товар 
            в разных сессиях поиска будет иметь совершенно разные product_id.
        rank:
          description: >+
            Рейтинг товара по мнению пользователей.
          type: number
          nullable: true
          default: 0
          minimum: 0
        product_description:
          # Описание товара в стандартной структуре, применяется для любого товара в поисковой выдаче.
          $ref: "#/components/schemas/ProductDescription"
        characteristics:
          # Список характеристик товара, формируется динамически для конкретного результата в поиске.
          type: array
          items:
            $ref: "#/components/schemas/Characteristics"
        offers:
          type: array
          description: Список предложений по товару из источников (поставщиков)
          items:
            $ref: "#/components/schemas/Offer"
    
    ProductDescription:
      type: object
      description: Общее описание товара
      required:
        - model
        - min_price
        - max_price
      properties:
        model:
          type: string
          description: Модель / наименование товара
        currency:
          $ref: "#/components/schemas/Currencies"
        min_price:
          type: number
          minimum: 0
          default: 0
          description: Минимальная цена
        max_price:
          description: Максимальная цена
          type: number
          minimum: 0
          default: 0
        manufacturer:
          description: Производитель/бренд
          type: string
          nullable: true
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        article:
          description: Артикул - код товара по данным поставщика, представленного в данной карточке товара.
          type: string
          nullable: true
        line:
          description: Линейка товаров по данным поставщика, представленного в данной карточке товара.
          type: string
          nullable: true
        variant:
          description: Опции товара / исполнения по данным поставщика, представленного в данной карточке товара.
          type: string
          nullable: true
        images:
          description: Ссылки на изображения товара по данным поставщика.
          type: array
          nullable: true
          items:
            type: string
            format: uri
    
    Characteristics:
      type: object
      description: >+
        Характеристика товара - формируется динамически по данным, 
        доступным в описании товара во внешней системе.
      required:
        - name
        - value
      properties:
        name:
          type: string
          nullable: false
          description: Наименование характеристики
        value:
          type: string
          nullable: true
          description: Значение характеристики
        unit:
          type: string
          nullable: true
          description: Единица измерения характеристики (может отсутствовать)
   
    Offer:
      type: object
      description: Конкретное предложение, релевантное данному товару
      required:
        - offer_id
        - platform_type
        - platform_name
        - source_product_name
        - price
        - currency
        - product_uri
      properties:
        offer_id:
          type: string
          format: uuid
          description: Идентификатор предложения в результатах поиска
        platform_type:
          type: string
          description: Тип площадки / источник предложения
        platform_name:
          type: string
          description: Название площадки / источника предложения
        source_product_name:
          type: string
          description: Название товара в источнике
        price:
          type: number
          minimum: 0
          description: Цена товара
        currency:
          $ref: "#/components/schemas/Currencies"
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        delivery_cost:
          type: number
          nullable: true
          minimum: 0
          description: Стоимость доставки
        delivery_currency:
          $ref: "#/components/schemas/Currencies"
        delivery_time:
          description: Предполагаемая дата доставки в формате YYYY-MM-DD, без часового пояса.
          type: string
          format: date
          nullable: true
        supplier_name:
          type: string
          nullable: true
          description: Название поставщика по данным источника
        supplier_rating:
          type: number
          description: Рейтинг поставщика
        images:
          description: Ссылки на изображения товара в источнике предложения.
          type: array
          items:
            type: string
            format: uri
        product_uri:
          type: string
          format: uri
          nullable: false
          description: Ссылка на страницу товара в источнике

    OrderCard:
      description: Тело объекта ЗАКАЗ. Определяет - какую именно позицию и в каком количестве нужно заказать
      type: object
      required:
        - quantity
        - product
      properties:
        quantity:
          description: Количество товаров для заказа.
          type: number
          minimum: 0
          exclusiveMinimum: true
          format: float
        delivery_address:
          nullable: false
          type: "string"
          description: >+
            Адрес доставки.
        delivery_time:
          description: Предполагаемая дата доставки в формате YYYY-MM-DD, без часового пояса.
          type: string
          format: date
          nullable: true
        product:
          $ref: "#/components/schemas/ProductCard"

    OrderRequestBody:
      description: Тело запроса на формирование заказа на закупку или подготовку коммерческого предложения
      type: object
      required:
        - search_id
        - selected_items
      properties:
        search_id:
          type: string
          format: uuid
          description: Идентификатор завершенного поискового запроса
        selected_items:
          description: >+
            Массив объектов `OrderCard` (т.е. полное описание товара, и количество для заказа.
            Содержит предложения по данному товару в результатах поиска, 
            отобранные на стороне внешней системы для формирования заказа.
          type: array
          items:
            $ref: "#/components/schemas/OrderCard"

    # ORDER RESPONSE object
    OrderResponse:
      type: object
      description: >+
        Объект [ответ] сервера VM на запрос создания заказа на закупку.
      required:
        - request_context
        - description
        - timestamp
        - search_id
      properties:
        request_context:
          $ref: "#/components/schemas/RequestContext"

        description:
          type: string
          description: Расширенное описание статуса ответа VM

        timestamp:
          type: string
          format: date-time
          description: Метка времени ISO-8601 (UTC/Z) создания ответа на стороне VM

        search_id:
          type: string
          nullable: false
          format: uuid
          description: >+
            Уникальный код поисковой сессии на стороне VM.
            **request_id <-> search_id** образуют уникальную пару для точной идентификации и
            сопоставления результатов с конкретным поисковым запросом.
            **Может** иметь значение NULL, если `search_status = NONE`.

        order_id:
          description: >+
            ID запроса на формирование заказа, сформированного на стороне VM.
            Может иметь значение `null`, если при формировании заказа возникли ошибки.
          type: string
          nullable: true
          format: "uuid"

        order_status:
          description: >+
            Статус запроса на создание заказа. Этот статус отправляется в синхронном режиме,
            т.е. запросившая сторона всегда получает информацию о данном статусе сиинхронно 
            с запросом.
          type: string
          default: Created
          enum:
            # TODO: Согласовать с другой стороной
            [Declined, Created]
            # Варианты интерпретации:
            # Declined: Запрос отклонен; ошибки API описаны схемой ErrorResponse.
            #  Created: Запрос принят и находится в обработка. Дальнейшая работа по заказу [order_id] 
            #           производится вне данного API


    Currencies:
      description: Валюта стоимостного показателя - трехбуквенный код в формате ISO 4217
      type: object
      nullable: false
      externalDocs:
        description: Официальный источник ISO 4217:2015 / XML, XLS
        url: https://www.six-group.com/en/products-services/financial-information/market-reference-data/data-standards.html
      required:
        - code
      properties:
        code:
          type: string
          default: RUB
          enum: [RUB, USD, EUR, <see extDoc>]

    Dimensions:
      type: object
      nullable: true      
      description: >+
        Физические размеры объекта поиска по данным продавца
      properties:
        length:
          type: number
          minimum: 0
          description: Длина / Глубина
        width:
          type: number
          minimum: 0
          description: Ширина
        height:
          type: number
          minimum: 0
          description: Высота
        unit:
          type: string
          description: Единица измерения - указывается по данным поставщика. Нормализация не применяется.

  securitySchemes:
    bearerAuth:
      description: >+
        Bearer-токен обязателен для всех запросов API.
        Передаётся в заголовке Authorization: Bearer <token>.
        Должен однозначно указывать на конкретного сервис-партнера и конкретного пользователя или организацию
        авторизованного для выполнения данного запроса.
      type: http
      scheme: bearer
      bearerFormat: JWT
